<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Väder">
<title>Väderstation</title>
<!--
  Väderskärm för gammal iPad mini (fungerar ända ner till iOS 9).
  Skriven i ES5 utan moderna JS-funktioner, med data från SMHI (snow1g)
  och pollenprognos från Pollenrapporten.se (närmaste mätstation väljs automatiskt).
  Plats väljs med URL-parametrar, t.ex.  index.html?lat=58.35&lon=11.93&namn=Uddevalla
  Tryck på Väder/Foto för att byta vy. Med &vy=foto startar sidan i fotoläget och stannar där.
  Egna fotoplatser läggs in i listan PLATSER längre ner.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .wrap { box-sizing: border-box; height: 100%; padding: 22px 36px;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
  .row { display: -webkit-box; display: -webkit-flex; display: flex; }
  .grow { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .muted { color: #8b949e; }

  .top { -webkit-box-align: start; -webkit-align-items: flex-start; align-items: flex-start; }
  .clock { font-size: 100px; font-weight: 200; line-height: 1; letter-spacing: -2px; }
  .date { font-size: 26px; margin-top: 8px; }
  .place { font-size: 22px; text-align: right; }
  .updated { font-size: 15px; text-align: right; margin-top: 6px; }

  .now { margin-top: 12px; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .now-icon { font-size: 92px; line-height: 1; width: 130px; }
  .now-temp { font-size: 110px; font-weight: 200; line-height: 1; margin-left: 10px; }
  .now-text { font-size: 28px; margin-left: 30px; }
  .facts { font-size: 22px; line-height: 1.7; text-align: right; }
  .facts b { font-weight: 500; color: #e6edf3; }

  .section { font-size: 15px; letter-spacing: 1px; text-transform: uppercase; margin: 16px 0 8px; }
  .tiles .tile { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; text-align: center;
    background: #161b22; border-radius: 14px; padding: 8px 4px; margin-right: 10px; }
  .tiles .tile:last-child { margin-right: 0; }
  .tile .t { font-size: 17px; color: #8b949e; }
  .tile .i { font-size: 34px; margin: 4px 0; }
  .tile .v { font-size: 24px; }
  .tile .s { font-size: 15px; color: #8b949e; margin-top: 2px; }
  .rain { color: #58a6ff; }

  .pollen { -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .chip { background: #161b22; border-radius: 20px; padding: 6px 14px 6px 10px;
    margin: 0 8px 8px 0; font-size: 18px; white-space: nowrap; }
  .chip .dot { display: inline-block; width: 12px; height: 12px; border-radius: 6px;
    margin-right: 8px; vertical-align: 0; }
  .chip .lvl { color: #8b949e; margin-left: 6px; }
  .pollen-text { font-size: 16px; line-height: 1.4; }

  .error { color: #f0883e; font-size: 18px; margin-top: 10px; }

  /* Knappgrupper (Väder/Foto och dagväljare) */
  .seg { display: inline-block; border: 1px solid #3d3428; border-radius: 22px; padding: 2px; white-space: nowrap; }
  .seg span { display: inline-block; padding: 6px 16px; font-size: 17px; border-radius: 20px;
    color: #c9b48a; cursor: pointer; }
  .seg span.on { background: #e3b341; color: #1a140c; }
  .tabs-row { text-align: right; margin-bottom: 10px; }

  /* Fotoläge */
  body.foto { background: #15110c; }
  .foto-title { font-size: 34px; font-weight: 300; color: #f3e6c8; }
  .foto-title .cam { color: #e3b341; margin-right: 6px; }
  .fhead { -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    padding-bottom: 12px; border-bottom: 1px solid #3d3428; }
  .fhead .seg { margin-left: 14px; }
  .fbody { margin-top: 14px; }
  .fcol-left { width: 360px; padding-right: 26px; border-right: 1px solid #3d3428; }
  .fcol-right { padding-left: 26px; }
  .fsec { font-size: 22px; color: #e3b341; margin: 4px 0 10px; }
  .fsec.later { margin-top: 18px; }
  .fl { font-size: 20px; line-height: 1.7; color: #d8ccb4; white-space: nowrap; overflow: hidden; }
  .fl .fi { display: inline-block; width: 30px; }
  .fl b { font-weight: 500; color: #f3e6c8; }
  .fl .why { color: #9a8a6c; font-size: 16px; }
  .foto .tiles .tile { background: #1f1912; border: 1px solid #3d3428; }
  .foto .tile .t, .foto .tile .s { color: #b09d78; }
  .foto .tile.past { opacity: 0.45; }
  .foto .tile .s.gold { color: #e3b341; }
  .foto .tile .i { font-size: 40px; margin: 8px 0; }
  .foto .tile { padding: 12px 4px; }
  .tip { background: #1f1912; border: 1px solid #3d3428; border-radius: 14px; padding: 14px 18px; margin-bottom: 12px;
    text-decoration: none; color: inherit; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .tip:active { background: #2a2219; }
  .tip .chev { font-size: 40px; color: #e3b341; margin-left: 16px; line-height: 1; }
  .tip .tn { font-size: 23px; color: #f3e6c8; }
  .tip .td { font-size: 16px; color: #b09d78; margin-top: 2px; }
  .tip .tw { font-size: 17px; color: #d8ccb4; white-space: nowrap; }
  .tip .tr { font-size: 17px; color: #e3b341; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap" id="vWeather">
  <div class="row top">
    <div class="grow">
      <div class="clock" id="clock">--:--</div>
      <div class="date muted" id="date"></div>
    </div>
    <div>
      <div class="tabs-row"><div class="seg"><span class="on">Väder</span><span data-view="foto">Foto</span></div></div>
      <div class="place" id="place"></div>
      <div class="updated muted" id="updated">Hämtar prognos…</div>
    </div>
  </div>

  <div class="row now">
    <div class="now-icon" id="nowIcon"></div>
    <div class="now-temp" id="nowTemp"></div>
    <div class="now-text grow" id="nowText"></div>
    <div class="facts muted" id="facts"></div>
  </div>

  <div class="section muted">Kommande timmar</div>
  <div class="row tiles" id="hours"></div>

  <div class="section muted">Kommande dagar</div>
  <div class="row tiles" id="days"></div>

  <div class="section muted" id="pollenTitle">Pollen</div>
  <div class="row pollen" id="pollen"></div>

  <div class="error" id="error"></div>
</div>

<div class="wrap" id="vFoto" style="display:none">
  <div class="row fhead">
    <div class="foto-title grow"><span class="cam">📷</span> Fotoläge – <span id="fDayName"></span></div>
    <div class="seg" id="fDays"></div>
    <div class="seg"><span data-view="weather">Väder</span><span class="on">Foto</span></div>
  </div>
  <div class="row fbody grow">
    <div class="fcol-left">
      <div class="fsec">Fotoförhållanden</div>
      <div id="fCond"></div>
      <div class="fsec later">Bäst ljus</div>
      <div id="fLight"></div>
    </div>
    <div class="fcol-right grow">
      <div class="fsec">Väder &amp; ljus</div>
      <div class="row tiles" id="fTiles"></div>
      <div class="fsec later">Utflyktstips</div>
      <div id="fTips"></div>
    </div>
  </div>
</div>

<script>
(function () {
  // ---- Inställningar (kan överstyras med ?lat=..&lon=..&namn=..) ----
  var DEFAULT = { lat: 57.71, lon: 11.97, namn: 'Göteborg' };
  var REFRESH_MIN = 30;        // hämta ny prognos var 30:e minut
  var RELOAD_HOURS = 6;        // ladda om hela sidan då och då (håller gamla Safari pigg)

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }
  var lat = parseFloat(param('lat')) || DEFAULT.lat;
  var lon = parseFloat(param('lon')) || DEFAULT.lon;
  var namn = param('namn') || (param('lat') ? '' : DEFAULT.namn);

  var DAYS = ['söndag', 'måndag', 'tisdag', 'onsdag', 'torsdag', 'fredag', 'lördag'];
  var MONTHS = ['januari', 'februari', 'mars', 'april', 'maj', 'juni', 'juli',
                'augusti', 'september', 'oktober', 'november', 'december'];
  var DIRS = ['N', 'NO', 'O', 'SO', 'S', 'SV', 'V', 'NV'];

  // SMHI:s vädersymboler (Wsymb2, 1–27)
  var SYMBOLS = {
    1: ['☀️', 'Klart'], 2: ['🌤', 'Nästan klart'], 3: ['⛅️', 'Växlande molnighet'],
    4: ['⛅️', 'Halvklart'], 5: ['🌥', 'Molnigt'], 6: ['☁️', 'Mulet'], 7: ['🌫', 'Dimma'],
    8: ['🌦', 'Lätta regnskurar'], 9: ['🌦', 'Regnskurar'], 10: ['🌧', 'Kraftiga regnskurar'],
    11: ['⛈', 'Åskskurar'], 12: ['🌨', 'Lätta byar av snöblandat regn'],
    13: ['🌨', 'Byar av snöblandat regn'], 14: ['🌨', 'Kraftiga byar av snöblandat regn'],
    15: ['🌨', 'Lätta snöbyar'], 16: ['🌨', 'Snöbyar'], 17: ['❄️', 'Kraftiga snöbyar'],
    18: ['🌧', 'Lätt regn'], 19: ['🌧', 'Regn'], 20: ['🌧', 'Kraftigt regn'], 21: ['⛈', 'Åska'],
    22: ['🌨', 'Lätt snöblandat regn'], 23: ['🌨', 'Snöblandat regn'],
    24: ['🌨', 'Kraftigt snöblandat regn'], 25: ['🌨', 'Lätt snöfall'], 26: ['❄️', 'Snöfall'],
    27: ['❄️', 'Kraftigt snöfall']
  };
  function sym(code, hour) {
    var s = SYMBOLS[code] || ['', ''];
    // Natt: byt sol mot måne för klart/nästan klart
    if ((hour < 6 || hour >= 20) && (code === 1 || code === 2)) return ['🌙', s[1]];
    return s;
  }

  function $(id) { return document.getElementById(id); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function deg(t) { return Math.round(t) + '°'; }
  function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function parseTime(s) {
    // "2026-11-01T10:00:00Z" – manuell tolkning för säkerhets skull i gammal Safari
    var p = s.match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);
    return new Date(Date.UTC(+p[1], +p[2] - 1, +p[3], +p[4], +p[5]));
  }

  function tickClock() {
    var d = new Date();
    $('clock').innerHTML = hm(d);
    $('date').innerHTML = cap(DAYS[d.getDay()]) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }

  function render(json) {
    var now = new Date();
    var series = [];
    for (var i = 0; i < json.timeSeries.length; i++) {
      var ts = json.timeSeries[i];
      var t = parseTime(ts.time);
      if (t.getTime() > now.getTime() - 3600000) series.push({ t: t, d: ts.data });
    }
    if (!series.length) throw new Error('Tom prognos');

    // Nu
    var c = series[0].d;
    var s = sym(c.symbol_code, series[0].t.getHours());
    $('nowIcon').innerHTML = s[0];
    $('nowTemp').innerHTML = deg(c.air_temperature);
    $('nowText').innerHTML = s[1];
    $('facts').innerHTML =
      'Vind <b>' + Math.round(c.wind_speed) + ' m/s ' + DIRS[Math.round(c.wind_from_direction / 45) % 8] +
      '</b> (byar ' + Math.round(c.wind_speed_of_gust) + ')<br>' +
      'Luftfuktighet <b>' + Math.round(c.relative_humidity) + ' %</b><br>' +
      'Lufttryck <b>' + Math.round(c.air_pressure_at_mean_sea_level) + ' hPa</b>';

    // Kommande timmar: var 2:a timme, 7 rutor
    var h = '';
    for (var k = 1, n = 0; k < series.length && n < 7; k += 2, n++) {
      var e = series[k], es = sym(e.d.symbol_code, e.t.getHours());
      var mm = e.d.precipitation_amount_mean;
      h += '<div class="tile"><div class="t">' + pad(e.t.getHours()) + '</div>' +
           '<div class="i">' + es[0] + '</div><div class="v">' + deg(e.d.air_temperature) + '</div>' +
           '<div class="s' + (mm > 0 ? ' rain' : '') + '">' +
           (mm > 0 ? (Math.round(mm * 10) / 10) + ' mm' : Math.round(e.d.wind_speed) + ' m/s') +
           '</div></div>';
    }
    $('hours').innerHTML = h;

    // Kommande dagar: min/max och symbol närmast kl 13, från och med i morgon
    var days = {}, order = [], todayKey = dayKey(now);
    for (var j = 0; j < series.length; j++) {
      var x = series[j], key = dayKey(x.t);
      if (key === todayKey) continue;
      if (!days[key]) { days[key] = { date: x.t, min: 99, max: -99, rain: 0, sym: 0, symDist: 99 }; order.push(key); }
      var dd = days[key], tp = x.d.air_temperature;
      if (tp < dd.min) dd.min = tp;
      if (tp > dd.max) dd.max = tp;
      dd.rain += x.d.precipitation_amount_mean || 0;  // summeras per tidssteg (ungefärligt vid längre steg)
      var dist = Math.abs(x.t.getHours() - 13);
      if (dist < dd.symDist) { dd.symDist = dist; dd.sym = x.d.symbol_code; }
    }
    var dh = '';
    for (var m = 0; m < order.length && m < 7; m++) {
      var day = days[order[m]];
      dh += '<div class="tile"><div class="t">' + (m === 0 ? 'I morgon' : cap(DAYS[day.date.getDay()].substr(0, 3))) + '</div>' +
            '<div class="i">' + sym(day.sym, 13)[0] + '</div>' +
            '<div class="v">' + deg(day.max) + ' <span class="muted">' + deg(day.min) + '</span></div>' +
            '<div class="s' + (day.rain >= 0.5 ? ' rain' : '') + '">' +
            (day.rain >= 0.5 ? Math.round(day.rain) + ' mm' : '&nbsp;') + '</div></div>';
    }
    $('days').innerHTML = dh;

    fSeries = series;
    renderFoto();

    $('updated').innerHTML = 'Uppdaterad ' + hm(now) + ' · SMHI';
    $('error').innerHTML = '';
  }

  function load() {
    var url = 'https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/' +
              lon.toFixed(4) + '/lat/' + lat.toFixed(4) + '/data.json';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 20000;
    xhr.onload = function () {
      try {
        if (xhr.status !== 200) throw new Error('SMHI svarade ' + xhr.status);
        render(JSON.parse(xhr.responseText));
      } catch (err) { showError(err.message); }
    };
    xhr.onerror = function () { showError('Kunde inte nå SMHI (nätverksfel)'); };
    xhr.ontimeout = function () { showError('SMHI svarade inte i tid'); };
    xhr.send();
  }
  function showError(msg) {
    $('error').innerHTML = msg + ' – försöker igen om en stund.';
    setTimeout(load, 5 * 60000);
  }

  // ---- Fotoläge ----
  // Fotoplatser inom ca 2 timmars restid från Göteborg. Vädret för varje plats hämtas i bakgrunden.
  // typ: 'kust', 'sjö', 'skog' eller 'landskap'. vast: true om platsen vetter mot solnedgången.
  // restid: tid med bil från centrala Göteborg i minuter (OSRM/OpenStreetMap; Vrångö och Hönö inkl. färja).
  // Koordinater från OpenStreetMap.
  var MAX_RESTID = 120;
  var PLATSER = [
    { namn: 'Delsjöarna', typ: 'sjö', restid: 15, lat: 57.684, lon: 12.044, text: 'Stilla vatten · skog · nära staden' },
    { namn: 'Stora Amundön', typ: 'kust', vast: true, restid: 25, lat: 57.592, lon: 11.911, text: 'Kala klippor · nära staden' },
    { namn: 'Bohus fästning', typ: 'landskap', restid: 25, lat: 57.862, lon: 12.000, text: 'Ruin · Nordre älv · höstfärger' },
    { namn: 'Vättlefjäll', typ: 'skog', restid: 30, lat: 57.835, lon: 12.071, text: 'Sjöar · ljunghedar · mossar' },
    { namn: 'Särö Västerskog', typ: 'skog', restid: 35, lat: 57.505, lon: 11.926, text: 'Vindpinade ekar · havsvik' },
    { namn: 'Fjärås Bräcka', typ: 'landskap', vast: true, restid: 40, lat: 57.443, lon: 12.187, text: 'Grusås · utsikt över Lygnern och havet' },
    { namn: 'Tjolöholm', typ: 'kust', restid: 45, lat: 57.399, lon: 12.103, text: 'Slott · ekhagar · havsvik' },
    { namn: 'Svartedalen', typ: 'skog', restid: 50, lat: 57.999, lon: 12.019, text: 'Urskogskänsla · sjöar · mossa' },
    { namn: 'Marstrand', typ: 'kust', vast: true, restid: 50, lat: 57.887, lon: 11.589, text: 'Fästning · kustsamhälle · kvällsljus' },
    { namn: 'Hållsundsudde', typ: 'kust', vast: true, restid: 55, lat: 57.344, lon: 11.999, text: 'Öppet kustlandskap · kvällsljus' },
    { namn: 'Hönö Klåva', typ: 'kust', vast: true, restid: 60, lat: 57.682, lon: 11.644, text: 'Fiskehamn · bryggor · solnedgång' },
    { namn: 'Getterön, Varberg', typ: 'kust', vast: true, restid: 65, lat: 57.120, lon: 12.212, text: 'Fågelliv · strandängar · fästningen' },
    { namn: 'Risveden', typ: 'skog', restid: 65, lat: 57.968, lon: 12.309, text: 'Vildmark · bäckar · gammal skog' },
    { namn: 'Pilane, Tjörn', typ: 'landskap', vast: true, restid: 65, lat: 58.029, lon: 11.554, text: 'Skulpturer · ljunghed · fårbete' },
    { namn: 'Trollhättefallen', typ: 'landskap', restid: 65, lat: 58.282, lon: 12.278, text: 'Kanjon · kraftverk · fallen släpps vissa dagar' },
    { namn: 'Klädesholmen', typ: 'kust', vast: true, restid: 70, lat: 57.944, lon: 11.538, text: 'Sjöbodar · klippor · sillön' },
    { namn: 'Vrångö', typ: 'kust', vast: true, restid: 75, lat: 57.576, lon: 11.785, text: 'Skärgård · hällar · sandstrand' },
    { namn: 'Mollösund', typ: 'kust', vast: true, restid: 85, lat: 58.073, lon: 11.475, text: 'Fiskeläge · klippor · öppet hav' },
    { namn: 'Skrea strand', typ: 'kust', vast: true, restid: 85, lat: 56.887, lon: 12.504, text: 'Långgrund sandstrand · horisont' },
    { namn: 'Fjällbacka', typ: 'kust', vast: true, restid: 100, lat: 58.599, lon: 11.283, text: 'Vetteberget · Kungsklyftan · skärgårdsutsikt' },
    { namn: 'Hunneberg', typ: 'skog', restid: 105, lat: 58.345, lon: 12.431, text: 'Branter · bokskog · utsikt över Vänern' },
    { namn: 'Vitlycke, Tanum', typ: 'landskap', restid: 105, lat: 58.701, lon: 11.341, text: 'Hällristningar · världsarv' },
    { namn: 'Ramsvikslandet', typ: 'kust', vast: true, restid: 110, lat: 58.421, lon: 11.248, text: 'Röd granit · Tjurpannan · öppet hav' },
    { namn: 'Södra Bullaresjön', typ: 'sjö', restid: 110, lat: 58.705, lon: 11.569, text: 'Höstfärger · stilla vatten · spegling' },
    { namn: 'Stångehuvud, Lysekil', typ: 'kust', vast: true, restid: 110, lat: 58.271, lon: 11.414, text: 'Röda granithällar · öppet hav' },
    { namn: 'Smögen', typ: 'kust', vast: true, restid: 115, lat: 58.354, lon: 11.226, text: 'Klippor · fiskeläge · solnedgång' },
    // Söderåsen i Skåne – ligger utanför 2 timmar och visas bara om MAX_RESTID höjs
    { namn: 'Klöva hallar', typ: 'skog', restid: 170, lat: 56.081, lon: 13.120, text: 'Ravin · bokskog · branta klippväggar' }
  ];
  // Vägbeskrivning med bil i Apple Kartor från sidans plats (öppnar Kartor-appen på iPaden)
  function routeUrl(pl) {
    return 'https://maps.apple.com/?saddr=' + lat + ',' + lon + '&daddr=' + pl.lat + ',' + pl.lon + '&dirflg=d';
  }
  function restText(m) { return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + pad(m % 60) + ' min' : ''); }
  var fSeries = [], fDay = 0, fDayAuto = true;

  // Solens höjd över horisonten i grader (förenklad astronomisk formel, ~0,1° noggrannhet)
  function sunElev(t) {
    var rad = Math.PI / 180, d = t.getTime() / 86400000 - 10957.5;   // dagar sedan J2000
    var g = (357.529 + 0.98560028 * d) * rad, q = 280.459 + 0.98564736 * d;
    var L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
    var e = (23.439 - 0.00000036 * d) * rad;
    var ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
    var dec = Math.asin(Math.sin(e) * Math.sin(L));

      for (var i = 0; i < SUN_TH.length; i++) {
        if (prev < SUN_TH[i] && e >= SUN_TH[i]) ev.up[i] = t;

    if (elev < -6) return 'Mörkt';
    if (elev < -4) return 'Blå timme';
    if (elev < 6) return octas <= 6 ? 'Gyllene' : 'Lågt, mjukt';

    if (d.precipitation_amount_mean > 0.2) return ['låg', 'nederbörd'];

  function moon(t) {

    var ill = Math.round((1 - Math.cos(2 * Math.PI * age / syn)) / 2 * 100);
    var icons = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];

  // Fotoförhållanden under dagsljus för en tidsserie (Göteborg eller en fotoplats)
  function conditions(series, d0, ev) {
    var rise = ev.up[2], set = ev.dn[2];
    var dayFrom = rise || new Date(d0.getTime() + 9 * 3600000), dayTo = set || new Date(d0.getTime() + 15 * 3600000);
    var c = { dl: between(dayFrom, dayTo, series) }, dl = c.dl, i;
    if (!dl.length) return c;
    c.oct = avg(dl, 'cloud_area_fraction'); c.wind = avg(dl, 'wind_speed');
    c.lowC = avg(dl, 'low_type_cloud_area_fraction');
    c.upC = Math.max(avg(dl, 'medium_type_cloud_area_fraction'), avg(dl, 'high_type_cloud_area_fraction'));
    c.vis = avg(dl, 'visibility_in_air'); c.rainP = 0; c.rainMm = 0; c.tMax = -99;
    for (i = 0; i < dl.length; i++) {

      c.rainMm += dl[i].precipitation_amount_mean || 0;
      c.tMax = Math.max(c.tMax, dl[i].air_temperature);

    // Dimma: morgontimmarna kring soluppgång
    c.fog = '–';

        for (i = 0; i < mo.length; i++) {

    if (ev.dn[3] && ev.dn[1]) gw = gw.concat(between(ev.dn[3], ev.dn[1], series));
    if (!gw.length) gw = dl;
    c.gWind = 99;

  function renderFoto() {

    }

    var rise = ev.up[2], set = ev.dn[2];
    var dName = fDay === 0 ? 'idag' : fDay === 1 ? 'i morgon' : DAYS[d0.getDay()];
    $('fDayName').innerHTML = cap(DAYS[d0.getDay()]) + (fDay === 0 ? ' (idag)' : '');

    // Dagväljare: de dagar som har timprognos
    var dh = '';
    for (var k = 0; k < 3; k++) {
      var lab = k === 0 ? 'Idag' : k === 1 ? 'I morgon' : cap(DAYS[dayStart(k).getDay()].substr(0, 3));
      dh += '<span data-day="' + k + '"' + (k === fDay ? ' class="on"' : '') + '>' + lab + '</span>';
    }

    var oct = home.oct, wind = home.wind, lowC = home.lowC, upC = home.upC, vis = home.vis;
    var rainP = home.rainP, rainMm = home.rainMm, fog = home.fog, gWind = home.gWind;
    var c = '';

    } else {

      if (ev.max < 15 && oct <= 6) light += ', lågt och varmt';

      c += line('💨', 'Vind', Math.round(wind) + ' m/s (' + windWord(Math.round(wind)) + ')');
      c += line('☁️', 'Moln', Math.round(oct / 8 * 100) + ' %',
                lowC >= upC ? (lowC >= 1 ? 'mest låga' : '') : 'mest höga');
      c += line('👁', 'Sikt', vis >= 20 ? 'mycket god' : vis >= 10 ? 'god' : vis >= 4 ? 'måttlig, dis' : 'dålig', Math.round(vis) + ' km');
      c += line('🌫', 'Chans till dimma', fog, fog !== '–' ? 'morgon' : '');
      c += line('🌧', 'Regnrisk', rainP + ' %', rainMm >= 0.1 ? Math.round(rainMm * 10) / 10 + ' mm' : 'uppehåll');
      c += line('💧', 'Spegling', gWind < 2 ? 'goda' : gWind < 4 ? 'möjliga' : 'små', 'vind ' + Math.round(gWind) + ' m/s');

    // Bäst ljus

    var l = '';

    l += line('🌅', 'Soluppgång', rise ? hm(rise) : '–', riseC ? 'färger: ' + riseC[0] : '');

    } else {
      l += line('✨', 'Morgonljus', range(ev.up[1], ev.up[3]));
      l += line('✨', 'Kvällsljus', range(ev.dn[3], ev.dn[1]));

    l += line('🌇', 'Solnedgång', set ? hm(set) : '–', setC ? 'färger: ' + setC[0] : '');
    l += line('🔵', 'Blå timme', range(ev.dn[1], ev.dn[0]), 'kväll');
    if (rise && set) {

               '<div class="i">' + (x ? sym(x.symbol_code, lw === 'Mörkt' || lw === 'Blå timme' ? 0 : 12)[0] : '–') + '</div>' +

          if (pc.fog === 'hög' || pc.fog === 'måttlig') add(1, 'Chans till dimma i morgonljuset');

            (tc ? '<div class="tw">' + sym(tc.sym, 12)[0] + ' ' + deg(tc.tMax) + ' · ' + Math.round(tc.wind) + ' m/s' +

  // Hämta prognos för fotoplatserna en i taget i bakgrunden (skonsamt för gamla iPaden)
  var placeSeries = [];
  function smhiUrl(la, lo) {
    return 'https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/' +
           lo.toFixed(4) + '/lat/' + la.toFixed(4) + '/data.json';

  function parseSeries(json, days) {

    }

  }
  function loadPlaces(i) {
    i = i || 0;

    getJSON(smhiUrl(PLATSER[i].lat, PLATSER[i].lon), function (json) {
      placeSeries[i] = parseSeries(json, 3.5);

    if (v === 'foto') renderFoto();

  }
  document.addEventListener('click', function (e) {

  });

  // ---- Pollen (Pollenrapporten.se, Naturhistoriska riksmuseet) ----
  var POLLEN_API = 'https://api.pollenrapporten.se/v1/';
  var POLLEN_LEVELS = ['Inga', 'Låga', 'Låga–måttliga', 'Måttliga', 'Måttliga–höga',

  var POLLEN_COLORS = ['#3fb950', '#3fb950', '#a5d64c', '#d29922', '#e3842b',
                       '#f0603c', '#f0603c', '#da3633'];
  var pollenRegion = null, pollenNames = null;
  var pollenDate = param('pollendatum');   // för test, t.ex. ?pollendatum=2026-05-06

  function getJSON(url, ok, fail) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 20000;
    xhr.onload = function () {
      if (xhr.status !== 200) return fail();

  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function loadPollen() {
    // Första gången: hämta mätstationer och pollensorter, välj närmaste station
    if (!pollenRegion) {
      return getJSON(POLLEN_API + 'regions', function (r) {
        var best = 1e9, cosLat = Math.cos(lat * Math.PI / 180);
        for (var i = 0; i < r.items.length; i++) {
          var it = r.items[i];
          if (!it.latitude) continue;           // hoppa över "Sverige"
          var dy = it.latitude - lat, dx = (it.longitude - lon) * cosLat, dist = dx * dx + dy * dy;
          if (dist < best) { best = dist; pollenRegion = it; }
        }
        getJSON(POLLEN_API + 'pollen-types', function (t) {
          pollenNames = {};
          for (var j = 0; j < t.items.length; j++) pollenNames[t.items[j].id] = t.items[j].name;
          loadPollen();
        }, pollenFail);
      }, pollenFail);
    }
    // API:et ger bara prognoser som ligger helt inom intervallet, och de spänner ofta över 2 dagar
    var next = pollenDate && ymd(new Date(new Date(pollenDate + 'T12:00:00').getTime() + 86400000));
    var url = POLLEN_API + 'forecasts?region_id=' + pollenRegion.id +
              (pollenDate ? '&start_date=' + pollenDate + '&end_date=' + next : '&current=true');
    getJSON(url, renderPollen, pollenFail);
  }

  function renderPollen(json) {
    $('pollenTitle').innerHTML = 'Pollen · ' + pollenRegion.name;
    var f = json.items && json.items[0];
    if (!f || f.isEndOfSeason || !f.levelSeries || !f.levelSeries.length) {
      $('pollen').innerHTML = '<div class="pollen-text muted">' +
        (f && !f.isEndOfSeason && f.text ? f.text : 'Pollensäsongen är slut – nya prognoser kommer i vår.') + '</div>';
      return;
    }
    // Välj dagens nivåer, annars första dagen i prognosen
    var today = pollenDate || ymd(new Date()), first = f.levelSeries[0].time.substr(0, 10);
    var day = today, found = false, i;
    for (i = 0; i < f.levelSeries.length; i++) if (f.levelSeries[i].time.substr(0, 10) === today) { found = true; break; }
    if (!found) day = first;
    var list = [];
    for (i = 0; i < f.levelSeries.length; i++) {
      var s = f.levelSeries[i];
      if (s.time.substr(0, 10) === day && s.level > 0) list.push(s);
    }
    list.sort(function (a, b) { return b.level - a.level; });
    if (!list.length) {
      $('pollen').innerHTML = '<div class="pollen-text muted">Inga pollenhalter väntas i dag.</div>';
      return;
    }
    var h = '';
    for (i = 0; i < list.length && i < 6; i++) {
      var lv = Math.min(list[i].level, 7);
      h += '<div class="chip"><span class="dot" style="background:' + POLLEN_COLORS[lv] + '"></span>' +
           (pollenNames[list[i].pollenId] || '?') + '<span class="lvl">' + POLLEN_LEVELS[lv] + '</span></div>';
    }
    $('pollen').innerHTML = h;
  }

  $('place').innerHTML = namn;
  showView(startView);
  tickClock();
  setInterval(tickClock, 10000);
  load();
  loadPollen();
  setTimeout(loadPlaces, 5000);
  setInterval(load, REFRESH_MIN * 60000);
  setInterval(loadPlaces, 60 * 60000);
  setInterval(loadPollen, 3 * 3600000);
  setTimeout(function () { location.reload(); }, RELOAD_HOURS * 3600000);
})();
</script>
</body>
</html>
